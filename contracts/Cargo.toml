[package]
name = "bolsillos"
description = "Bolsillos (pockets): household USDC split with per-pocket ownership, allowlists and daily caps"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/tuneupargentina/bolsillos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
